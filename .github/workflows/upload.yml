name: Ritmos do Brasil e do Mundo — Postar Short

on:
  schedule:
    - cron: '0 9 * * *'   # 06h BRT (9h UTC)
    - cron: '0 21 * * *'  # 18h BRT (21h UTC)
  workflow_dispatch:
    inputs:
      teste:
        description: 'Só gerar o vídeo (NÃO publicar) e anexar ao run'
        type: boolean
        default: false
      gospel:
        description: 'Forçar Short gospel'
        type: boolean
        default: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg e fontes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar e publicar Short
        run: python src/main.py
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SKIP_UPLOAD:           ${{ inputs.teste && '1' || '' }}
          FORCE_GOSPEL:          ${{ inputs.gospel && '1' || '' }}

      - name: Anexar vídeo de teste
        if: ${{ inputs.teste }}
        uses: actions/upload-artifact@v4
        with:
          name: short-teste
          path: teste/
          retention-days: 3
